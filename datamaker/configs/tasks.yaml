# ============ Retrieval: Needle in a Haystack ============
niah_single_1:
  task: niah
  args:
    type_haystack: noise
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 1
    num_needle_v: 1
    num_needle_q: 1

niah_single_2:
  task: niah
  args:
    type_haystack: noise
    type_needle_k: words
    type_needle_v: uuids
    num_needle_k: 1
    num_needle_v: 1
    num_needle_q: 1

niah_multikey_1:
  task: niah
  args:
    type_haystack: noise
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 4
    num_needle_v: 1
    num_needle_q: 2

niah_multivalue:
  task: niah
  args:
    type_haystack: noise
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 1
    num_needle_v: 4
    num_needle_q: 1

niah_multiquery:
  task: niah
  args:
    type_haystack: noise
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 4
    num_needle_v: 1
    num_needle_q: 4

niah_needle_noise:
  task: niah
  args:
    type_haystack: needle
    type_needle_k: words
    type_needle_v: numbers
    num_needle_k: 1
    num_needle_v: 1
    num_needle_q: 1

# ============ Multi-hop Tracing: Variable Tracking ============
vt_1:
  task: variable_tracking
  args:
    type_haystack: noise
    num_chains: 1
    num_hops: 4

vt_2:
  task: variable_tracking
  args:
    type_haystack: noise
    num_chains: 2
    num_hops: 4

vt_3:
  task: variable_tracking
  args:
    type_haystack: noise
    num_chains: 3
    num_hops: 6

# ============ Aggregation: Common Words Extraction ============
cwe:
  task: common_words_extraction
  args:
    freq_cw: 30
    freq_ucw: 3
    num_cw: 10

cwe_hard:
  task: common_words_extraction
  args:
    freq_cw: 50
    freq_ucw: 2
    num_cw: 15

# ============ Aggregation: Freq Words Extraction ============
fwe:
  task: freq_words_extraction
  args:
    alpha: 2.0

fwe_hard:
  task: freq_words_extraction
  args:
    alpha: 1.5

# ============ Aggregation: Numeric ============
num_agg_1:
  task: numeric_aggregation
  args:
    num_items: 8
    digits: 2

num_agg_2:
  task: numeric_aggregation
  args:
    num_items: 16
    digits: 3

# ============ Multi-hop: Temporal Ordering ============
temporal_1:
  task: temporal_ordering
  args:
    num_events: 8

temporal_2:
  task: temporal_ordering
  args:
    num_events: 16

# ============ Multi-hop: Entity Counting ============
entity_count_1:
  task: entity_counting
  args:
    target_freq: 8
    num_distractors: 6

entity_count_2:
  task: entity_counting
  args:
    target_freq: 15
    num_distractors: 8

# ============ Multi-hop: Fact Chain ============
fact_hop_1:
  task: multi_hop_fact
  args:
    num_hops: 2
    num_distractors: 4

fact_hop_2:
  task: multi_hop_fact
  args:
    num_hops: 3
    num_distractors: 5

# ============ QA ============
qa_squad:
  task: qa
  args:
    dataset: squad

qa_hotpot:
  task: qa
  args:
    dataset: hotpotqa